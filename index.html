const DATA=window.GORD_DATA;
const byId=s=>document.getElementById(s);
const H=new Map(DATA.heroes.map(h=>[h.name,h]));
const I=DATA.items;

const iconsReady=new Map();
const trait=(h,k)=>h.traits[k]||0;
const sum=(team,k)=>team.reduce((v,n)=>v+trait(H.get(n),k),0);
const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heroSlug=s=>s.toLowerCase().replace(/[.'’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const heroUrls=name=>{
 const special={
  "Chang'e":"chang27e",
  "Lapu-Lapu":"lapu-lapu",
  "Yi Sun-shin":"yi_sun-shin"
 };
 const filename=special[name]||heroSlug(name).replaceAll('-','_');
 return [
  `https://raw.githubusercontent.com/Ceplin03/database-mlbb.Mobile-Legends-Bang-Bang/master/images-hero/${filename}.png`,
  `https://mlbbhub.com/images/heroes/${heroSlug(name)}.png`
 ];
};
function face(urls,name,small=false){
 const first=iconsReady.get(name)||urls[0];
 const others=[first,...urls.filter(u=>u!==first)];
 return `<span class="face ${small?'sm':''}"><img alt="${esc(name)}" src="${esc(others[0])}" data-next="1" data-urls="${esc(encodeURIComponent(JSON.stringify(others)))}" loading="lazy" referrerpolicy="no-referrer" onerror="retryImage(this)" /><span class="letters">${esc(name.slice(0,2).toUpperCase())}</span></span>`;
}
window.retryImage=img=>{
 const candidates=JSON.parse(decodeURIComponent(img.getAttribute('data-urls')));
 const idx=Number(img.getAttribute('data-next'));
 if(idx<candidates.length){img.setAttribute('data-next',String(idx+1));img.src=candidates[idx];}
 else{img.onerror=null;img.remove();}
};
function metaRank(h){return h.tier==='S'?0:(h.tier==='A'?1:(h.proMeta?2:3))}
function renderTeam(t){
 const names=selected[t],limit=t==='enemy'?5:4;
 byId(t+'Count').textContent=`${names.length}/${limit}`;
 byId(t+'Slots').innerHTML=Array.from({length:limit},(_,i)=>{
  const n=names[i];return n?`<button type="button" class="slot chosen" data-remove="${i}" title="Hapus ${esc(n)}">${face(heroUrls(n),n)}<span>${esc(n)}</span><b class="x">×</b></button>`:`<span class="slot blank">+</span>`;
 }).join('');
 byId(t+'Slots').querySelectorAll('button[data-remove]').forEach(b=>b.onclick=()=>{
  selected[t].splice(Number(b.dataset.remove),1); renderTeam('enemy');renderTeam('ally');autoBuild();
 });
 const isFull=names.length>=limit;
 byId(t+'Search').style.display=isFull?'none':'';
 byId(t+'Matches').style.display=isFull?'none':'';
 const q=byId(t+'Search').value.trim().toLowerCase();
 const allow=DATA.heroes.filter(h=>h.name!=='Gord'&&!selected.enemy.includes(h.name)&&!selected.ally.includes(h.name));
 const matches=q?allow.filter(h=>h.name.toLowerCase().includes(q)).sort((a,b)=>metaRank(a)-metaRank(b)||a.name.localeCompare(b.name)).slice(0,12):[];

 matchDiv.innerHTML=names.length>=limit?'<div class="tip">Slot penuh. Hapus hero untuk mengganti.</div>':matches.map(h=>`<button type="button" class="suggest" data-name="${esc(h.name)}">${face(heroUrls(h.name),h.name,true)}<span>${esc(h.name)}</span>${h.tier==='S'||h.tier==='A'?`<i class="tier">${h.tier}</i>`:(h.proMeta?'<i class="tier">PRO</i>':'')}</button>`).join('');
 matchDiv.querySelectorAll('button[data-name]').forEach(b=>b.onclick=()=>{
  names.push(b.dataset.name);byId(t+'Search').value='';renderTeam('enemy');renderTeam('ally');autoBuild();
 });
}
['enemy','ally'].forEach(t=>{byId(t+'Search').addEventListener('input',()=>renderTeam(t));renderTeam(t)});
// Whole-draft signal strengths. Ratings are draft heuristics (0-3 per hero), NOT live match equipment or exact skill numbers.
function analyze(options={}){
 const deferWinter=!!options.deferWinter;
 const standardOrder=deferWinter?analyze().order:null;
 const en=selected.enemy,al=selected.ally;
 const enemyHeal=sum(en,'H'),enemySustain=sum(en,'S'),enemyVamp=sum(en,'L'),enemyShield=sum(en,'Q');
 const enemyTank=sum(en,'T'),enemyFront=sum(en,'F'),enemyDive=sum(en,'D'),enemyMob=sum(en,'M'),enemyBurst=sum(en,'B'),enemyCC=sum(en,'C'),enemyMagic=sum(en,'G'),enemyPoke=sum(en,'P'),enemyZone=sum(en,'Z');
 const allyCC=sum(al,'C'),allyPeel=sum(al,'R'),allyShield=sum(al,'Q'),allyFront=sum(al,'F'),allyHeal=sum(al,'H');
 const controlPressure=en.filter(n=>H.get(n).cc.some(c=>['suppress','freeze','polymorph','stun','knockup','pull','immobilize','taunt'].includes(c))).length;
 const enemyHardSup=en.filter(n=>H.get(n).cc.includes('suppress')).length;
 // Skill-mechanic signals supplement rather than replace original draft heuristics.
 const mechanics=n=>H.get(n).mechanics;
 const has=(n,group,tag)=>mechanics(n)[group].includes(tag);
 const count=(group,tags)=>en.reduce((v,n)=>v+tags.filter(tag=>has(n,group,tag)).length,0);
 const teamHeal=count('healing',['team_heal','ally_heal','global_heal']);
 const selfHeal=count('healing',['self_sustain','self_heal','self_regen','orb_self_heal']);
 const vamp=count('healing',['spell_vamp','lifesteal']);
 const shields=count('protection',['shield','self_shield','ally_shield']);
 const specialEngage=count('engage',['mounted_mobility','global_target_lock','backline_dive','area_lock','area_pull','trap_zone']);

 const rangedThreat=count('damage',['long_range_poke','area_detonation']);
 const healSources=en.filter(n=>{const h=H.get(n);return h.mechanics.healing.length>0 || trait(h,'H')>0||trait(h,'L')>=2}).length;
 const healNeed=enemyHeal*1.1 + teamHeal*2.0 + selfHeal*1.25 + vamp*1.45 + enemyVamp*.25 + Math.max(0,healSources-1)*.40;
 const shieldNeed=enemyShield*.45 + shields*.65; // Shields are tracked separately from healing; antiheal value is not automatically the same.
 const tankNeed=enemyTank*.95 + enemyFront*.35;
 const frontliners=en.filter(n=>{const h=H.get(n);return trait(h,'T')>=2||trait(h,'F')>=3}).length;
 const magicDefRisk=en.reduce((total,n)=>{const h=H.get(n);return total+Math.max(0,trait(h,'T')*.62+trait(h,'F')*.30-.7)},0);
 const penetrationNeed=magicDefRisk+Math.max(0,frontliners-1)*.35;

 const protection=allyPeel*.7+allyFront*.4+allyShield*.27+allyHeal*.22;
 const diveNeed=Math.max(0, enemyDive*.76+enemyBurst*.38+enemyMob*.22+specialEngage*.85-protection*.34);
 const slowNeed=Math.max(0, enemyMob*.78+enemyDive*.25+enemyZone*.15+specialEngage*.30-allyCC*.43-allyPeel*.30);
 const ccNeed=enemyCC*.5+controlPressure*.7;
 const magicNeed=enemyMagic*.65;
 const pokeNeed=enemyPoke*.7+rangedThreat*.5;
 const hardHeal=healNeed+shieldNeed*.40>=3.4&&(enemyHeal>=2||healSources>=2||teamHeal>0||vamp>=2);
 const hardDive=diveNeed>=5.2;
 const hardTank=tankNeed>=4.1;
 const hardPen=penetrationNeed>=3.5;

 const hardSlow=slowNeed>=4.0;

 const boots=(magicNeed>=3.2&&ccNeed>=3.2&&enemyHardSup===0)?'tough':((enemyTank<3&&enemyFront<4&&enemyDive<4&&enemyMob<5)?'arcane':'shoes');
 const S={
  glow:16+healNeed*11+shieldNeed*1.5-(healNeed<3.4?22:0),

  lantern:25+tankNeed*10,
  ice:21+slowNeed*10,
  winter:7+diveNeed*10,
  wings:8+diveNeed*4+pokeNeed*3,
  divine:18+penetrationNeed*8+(hardPen?10:0),

  crystal:50+(allyCC>=5?5:0),
  genius:25+(tankNeed<3?11:0),
  lightning:32+(enemyFront<4?5:0),
  clock:12+diveNeed*4,
  fleeting:7+(allyCC>=7?6:0),
  sky:-20
 };

 // Slot 2 must be an immediate counter, never pure scaling or reset.
 const early={
  glow:S.glow+(hardHeal?42:0),

  lantern:S.lantern+(hardTank?32:0),
  winter:S.winter+(hardDive?45:0)-(deferWinter?10000:0),
  ice:S.ice+(hardSlow?28:0),
  genius:S.genius-3,
  lightning:S.lightning-8,
  clock:S.clock-8,
  wings:S.wings-14
 };
 let second=Object.keys(early).sort((a,b)=>early[b]-early[a])[0];
 // Strongly contested healing / hard dive can both be included; remaining picks maximize damage and utility.
 const chosen=[second];
 const priorities=[[hardHeal,'glow'],[hardDive,'winter'],[hardTank,'lantern'],[hardPen,'divine']]
  .filter(([enabled])=>enabled).sort((a,b)=>S[b[1]]-S[a[1]]);
 for(const [,id] of priorities)if(!chosen.includes(id)&&chosen.length<3)chosen.push(id);

 let ranking=Object.keys(S).filter(id=>!chosen.includes(id)).sort((a,b)=>S[b]-S[a]);
 // Preserve at least one reliable DPS scaling item, even in counter-heavy drafts.
 const damage=['crystal','genius','lightning'];
 if(!chosen.some(id=>damage.includes(id))){
  const candidate=ranking.filter(id=>damage.includes(id))[0];
  if(chosen.length>=4)chosen[chosen.length-1]=candidate;else chosen.push(candidate);
 }
 while(chosen.length<4){const next=ranking.find(id=>!chosen.includes(id));chosen.push(next)}
 // Refresh preserves Winter Crown when it was recommended, while moving it later.
 if(deferWinter && !chosen.includes('winter') && standardOrder.includes('winter')){
  let replace=chosen.findLastIndex((id,i)=>i>0&&!['glow','lantern','crystal','genius','lightning'].includes(id));
  if(replace<0)replace=chosen.length-1;
  chosen[replace]='winter';
 }
 const remaining=chosen.filter(id=>id!==second).sort((a,b)=>{
  if(deferWinter && a==='winter' && b!=='winter')return -1;
  if(deferWinter && b==='winter' && a!=='winter')return 1;
  const late=id=>id==='crystal'?3:id==='divine'?2:1;

  return late(a)-late(b)||S[b]-S[a];
 });
 const order=[boots,second,'talisman',...remaining];
 // Refresh only moves an early Winter Crown to slot 4. Otherwise keep the original recommendation.
 if(deferWinter && standardOrder.indexOf('winter')!==1){
  order.splice(0,order.length,...standardOrder);
 }
 const cdItem=order.reduce((n,id)=>n+I[id].cd,0);
 const cd=Math.min(45,cdItem+10); // Mage emblem 5% + Inspire 5%; Talisman raises cap to 45%.
 const diagnostics={
  healNeed, tankNeed, diveNeed, slowNeed, protection, enemyCC, enemyMagic, enemyPoke,
  enemyHeal,enemySustain,enemyVamp,enemyShield,teamHeal,selfHeal,vamp,shields,specialEngage,antiDive,hardHeal,hardDive,hardTank,hardSlow
 };
 // Preserve backline spam playstyle: Flicker is default; Purify only if removable CC pressure is overwhelming.
 const cleanseable=en.reduce((v,n)=>v+mechanics(n).control.filter(c=>['stun','freeze','immobilize','polymorph','taunt','fear'].includes(c)).length,0);
 const hardLock=en.reduce((v,n)=>v+mechanics(n).control.filter(c=>['suppress','area_lock'].includes(c)).length,0);
 const spell=(cleanseable>=5 && hardLock===0 && enemyHardSup===0 && enemyBurst<8 && diveNeed<7.5)?'Purify':'Flicker';
 return {order,cd,rawCD:cdItem+10,boots,second,spell,signals:diagnostics,deferWinter,scores:S};
}
function noteFor(id,a){

 shoes:'Butuh cooldown awal untuk terus zoning.',arcane:'Draft relatif ringan: fokus tekanan damage awal.',tough:'Banyak ancaman magic dan CC; bantu jaga posisi.',
 talisman:'Wajib slot 3: regenerasi mana + 15% CDR.',
 glow:`Prediksi heal, regen dan spell vamp (${strength(s.healNeed)}); shield dianalisis terpisah.`,
 lantern:`Frontline / HP tebal (${strength(s.tankNeed)}).`,
 ice:`Musuh lincah; slow membantu skill 2 (${strength(s.slowNeed)}).`,
 winter:`Ancaman dive / burst ke Gord (${strength(s.diveNeed)}).`,
 wings:'Tambahan shield menghadapi poke dan dive.',
 genius:'Multi-hit Gord mengurangi magic defense lawan.',

 };

}
function strength(v){return v>=6?'tinggi':v>=2.8?'sedang':'rendah'}
function tags(a){const s=a.signals,t=[];
 if(s.healNeed>=2.8)t.push('Antiheal');
 if(s.tankNeed>=3.5)t.push('Anti-tank');

}
let latest='';

 byId('result').innerHTML=`<div class="row-title"><b>Build buat Gord</b><span style="display:flex;gap:8px;align-items:center"><button id="refresh" class="linkbtn" type="button">⟳ Refresh urutan</button><button id="copy" class="linkbtn" type="button">Salin ↗</button></span></div><div class="chips"><span class="pill">${a.cd}% CDR</span>${tags(a).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div class="itemgrid">${a.order.map((id,ix)=>`<div class="item ${id==='talisman'?'must':''}"><span class="num">${ix+1}</span>${images(id)}<b>${esc(I[id].name)}</b><small>${esc(I[id].desc)}</small></div>`).join('')}</div><div class="micro"><b>Emblem:</b> Mage · Inspire / Bargain Hunter / Impure Rage &nbsp; <b>Spell:</b> ${a.spell}</div><details><summary>Kenapa pilih item ini?</summary>${explain}</details><details><summary>Analisis hero (${selected.enemy.length} musuh + ${selected.ally.length} teman)</summary><div class="tiny-head">Musuh</div>${enemyProfiles||'<div class="tip">Belum ada hero.</div>'}<div class="tiny-head">Teman</div>${allyProfiles||'<div class="tip">Belum ada hero.</div>'}<div class="tip">Mekanik skill dicatat terpisah dari bobot perkiraan. Bukan pembacaan item musuh secara langsung; rank tier lama tidak otomatis menjadi win rate patch terbaru.</div></details><div class="tip">${refreshCounter?'Mode counter lebih awal: Winter Crown slot 2 dipindah ke slot 4; jika sudah lebih belakang, urutan tetap.':'Mode standar: prioritas counter sesuai skor ancaman draft.'} Tekan Refresh urutan untuk membandingkan. Talisman tetap slot 3. Prediksi berdasarkan draft Original Server 2.2.23, bukan kejadian atau item langsung dalam match.</div>`;
 if(winterAlternative){

 latest=`Gord vs ${selected.enemy.join(', ')||'(belum dipilih)'}\nTim ${selected.ally.join(', ')||'(belum dipilih)'}\n${a.order.map((id,i)=>`${i+1}. ${I[id].name}`).join('\n')}\nCDR ${a.cd}% (emblem) · ${a.spell}`;

 };
 byId('refresh').onclick=()=>{refreshCounter=!refreshCounter;build(false);};

 return a;
}
function profileChip(name){

  const info=[['Damage',m.damage],['Heal',m.healing],['Proteksi',m.protection],['Engage',m.engage]].filter(([,v])=>v.length).map(([k,v])=>k+': '+v.join(', ')).join(' · ');

  return `<div class="heroline"><b>${esc(h.name)} <small>${esc(h.tier)}${h.proMeta?' · Pro':''}${esc(patch)}</small></b><span>${esc(h.kit)}</span><small>CC: ${esc(cc)} · ${esc(h.role)}</small><small>${esc(info)}</small></div>`;
}

// Data is inline: loading covers data checks + image preflight. We never depend on internet for draft scoring.
(async function boot(){
 const progress=byId('progress'),msg=byId('bootMsg'),skip=byId('skip');
 let entered=false;
 const enter=()=>{if(entered)return;entered=true;document.body.classList.add('ready');};

  skip.onclick=enter;
  const valid=DATA.heroes.length===133&&Object.keys(I).length===16&&DATA.heroes.every(h=>h.kit&&h.role&&h.cc&&h.traits&&h.mechanics);
  if(!valid){msg.textContent='Data hero tidak lengkap';skip.style.display='block';return;}
  if(navigator.onLine===false){
   enter();
   return;
  }

 const gord='https://static.wikia.nocookie.net/mobile-legends/images/2/27/Hero231-icon.png';
 const tasks=[['Gord',[gord]],...Object.values(I).map(v=>[v.name,v.imgs]),...DATA.heroes.map(h=>[h.name,heroUrls(h.name)])];
 // Hold successfully decoded Image objects in memory while the tab is open.
 // Image URL cache itself may not persist after browser restarts; HTML logic does.
 const memoryImages=new Map();
 let checked=0,ok=0;
 const test=url=>new Promise(resolve=>{
  let finished=false;const img=new Image();
  const timer=setTimeout(()=>done(false),2200);
  function done(success){if(finished)return;finished=true;clearTimeout(timer);img.onload=null;img.onerror=null;resolve(success?img:null)}
  img.onload=()=>done(true);img.onerror=()=>done(false);img.referrerPolicy='no-referrer';img.src=url;
 });
 let next=0;
 async function worker(){
  while(next<tasks.length&&!entered){
   const index=next++, [name,urls]=tasks[index];let found=null;
   for(const url of urls){found=await test(url);if(found){iconsReady.set(name,url);memoryImages.set(name,found);break;}}
   checked++;if(found)ok++;
   progress.style.width=Math.round(checked/tasks.length*100)+'%';
   byId('bootCount').textContent=`${checked}/${tasks.length} gambar dicek · ${ok} tersedia`;
  }
 }
 msg.textContent='Menyiapkan database + semua gambar hero & item…';
 setTimeout(()=>{if(!entered){skip.style.display='block';msg.textContent='Masih memuat gambar. Bisa lanjut, tetapi gambar yang belum siap mungkin kosong.'}},7500);
 await Promise.all(Array.from({length:8},worker));
 if(entered)return;
 if(ok===tasks.length){msg.textContent=`Siap! ${ok} gambar dimuat.`;setTimeout(enter,450)}
 else{msg.textContent=`${ok}/${tasks.length} gambar siap. ${tasks.length-ok} gagal dimuat; login akan tetap offline untuk logic.`;skip.style.display='block';}
})();;
