const heroUrls=name=>{
 const special={
  "Chang'e":"chang27e",
  "Lapu-Lapu":"lapu-lapu",
  "Yi Sun-shin":"yi_sun-shin"
 };
 const filename=special[name]||heroSlug(name).replaceAll('-','_');
 return [
  `https://raw.githubusercontent.com/Ceplin03/database-mlbb.Mobile-Legends-Bang-Bang/master/images-hero/${filename}.png`,
  `https://mlbbhub.com/images/heroes/${heroSlug(name)}.png`
 ];
};
function face(urls,name,small=false){
 const first=iconsReady.get(name)||urls[0];
 const others=[first,...urls.filter(u=>u!==first)];
 return `<span class="face ${small?'sm':''}"><img alt="${esc(name)}" src="${esc(others[0])}" data-next="1" data-urls="${esc(encodeURIComponent(JSON.stringify(others)))}" loading="lazy" referrerpolicy="no-referrer" onerror="retryImage(this)" /><span class="letters">${esc(name.slice(0,2).toUpperCase())}</span></span>`;
}
window.retryImage=img=>{
 const candidates=JSON.parse(decodeURIComponent(img.getAttribute('data-urls')));
 const idx=Number(img.getAttribute('data-next'));
 if(idx<candidates.length){img.setAttribute('data-next',String(idx+1));img.src=candidates[idx];}
 else{img.onerror=null;img.remove();}
};
function metaRank(h){return h.tier==='S'?0:(h.tier==='A'?1:(h.proMeta?2:3))}
function renderTeam(t){
 const names=selected[t],limit=t==='enemy'?5:4;
 byId(t+'Count').textContent=`${names.length}/${limit}`;

  const n=names[i];return n?`<button type="button" class="slot chosen" data-remove="${i}" title="Hapus ${esc(n)}">${face(heroUrls(n),n)}<span>${esc(n)}</span><b class="x">×</b></button>`:`<span class="slot blank">+</span>`;
 }).join('');
 byId(t+'Slots').querySelectorAll('button[data-remove]').forEach(b=>b.onclick=()=>{
  selected[t].splice(Number(b.dataset.remove),1); renderTeam('enemy');renderTeam('ally');autoBuild();
 });
 const isFull=names.length>=limit;
 byId(t+'Search').style.display=isFull?'none':'';
 byId(t+'Matches').style.display=isFull?'none':'';
 const q=byId(t+'Search').value.trim().toLowerCase();
 const allow=DATA.heroes.filter(h=>h.name!=='Gord'&&!selected.enemy.includes(h.name)&&!selected.ally.includes(h.name));
 const matches=q?allow.filter(h=>h.name.toLowerCase().includes(q)).sort((a,b)=>metaRank(a)-metaRank(b)||a.name.localeCompare(b.name)).slice(0,12):[];

 matchDiv.innerHTML=names.length>=limit?'<div class="tip">Slot penuh. Hapus hero untuk mengganti.</div>':matches.map(h=>`<button type="button" class="suggest" data-name="${esc(h.name)}">${face(heroUrls(h.name),h.name,true)}<span>${esc(h.name)}</span>${h.tier==='S'||h.tier==='A'?`<i class="tier">${h.tier}</i>`:(h.proMeta?'<i class="tier">PRO</i>':'')}</button>`).join('');

  names.push(b.dataset.name);byId(t+'Search').value='';renderTeam('enemy');renderTeam('ally');autoBuild();
 });
}

function heroIntel(n){
 const profile=deepHeroIntel[n];
 if(!profile)throw new Error(`Profil taktis tidak ditemukan: ${n}`);
 return profile;
}
function analyze(options={}){
 const excludeWinter=!!options.excludeWinter;

 const en=selected.enemy,al=selected.ally;
 const enemyHeal=sum(en,'H'),enemySustain=sum(en,'S'),enemyVamp=sum(en,'L'),enemyShield=sum(en,'Q');
 const enemyTank=sum(en,'T'),enemyFront=sum(en,'F'),enemyDive=sum(en,'D'),enemyMob=sum(en,'M'),enemyBurst=sum(en,'B'),enemyCC=sum(en,'C'),enemyMagic=sum(en,'G'),enemyPoke=sum(en,'P'),enemyZone=sum(en,'Z');
 const allyCC=sum(al,'C'),allyPeel=sum(al,'R'),allyShield=sum(al,'Q'),allyFront=sum(al,'F'),allyHeal=sum(al,'H');
 const controlPressure=en.filter(n=>H.get(n).cc.some(c=>['suppress','freeze','polymorph','stun','knockup','pull','immobilize','taunt'].includes(c))).length;
 const enemyHardSup=en.filter(n=>H.get(n).cc.includes('suppress')).length;
 // Skill-mechanic signals supplement rather than replace original draft heuristics.
 const mechanics=n=>H.get(n).mechanics;
 const has=(n,group,tag)=>mechanics(n)[group].includes(tag);
 const count=(group,tags)=>en.reduce((v,n)=>v+tags.filter(tag=>has(n,group,tag)).length,0);
 const teamHeal=count('healing',['team_heal','ally_heal','global_heal']);
 const selfHeal=count('healing',['self_sustain','self_heal','self_regen','orb_self_heal']);
 const vamp=count('healing',['spell_vamp','lifesteal']);
 const shields=count('protection',['shield','self_shield','ally_shield']);
 const specialEngage=count('engage',['mounted_mobility','global_target_lock','backline_dive','area_lock','area_pull','trap_zone']);
 const antiDive=count('engage',['dash_interrupt','anti_dive_knockback','dash_restriction']);
 const rangedThreat=count('damage',['long_range_poke','area_detonation']);
 const healSources=en.filter(n=>{const h=H.get(n);return h.mechanics.healing.length>0 || trait(h,'H')>0||trait(h,'L')>=2}).length;
 const healNeed=enemyHeal*1.1 + teamHeal*2.0 + selfHeal*1.25 + vamp*1.45 + enemyVamp*.25 + Math.max(0,healSources-1)*.40;
 const shieldNeed=enemyShield*.45 + shields*.65; // Shields are tracked separately from healing; antiheal value is not automatically the same.
 const tankNeed=enemyTank*.95 + enemyFront*.35;
 const frontliners=en.filter(n=>{const h=H.get(n);return trait(h,'T')>=2||trait(h,'F')>=3}).length;
 const magicDefRisk=en.reduce((total,n)=>{const h=H.get(n);return total+Math.max(0,trait(h,'T')*.62+trait(h,'F')*.30-.7)},0);
 const penetrationNeed=magicDefRisk+Math.max(0,frontliners-1)*.35;

 const enemies=en.map(heroIntel), allies=al.map(heroIntel);
 const synergy=[];
 const pair=(a,b)=>en.includes(a)&&en.includes(b);
 if(en.includes('Angela')&&enemies.some(x=>x.access===3))synergy.push('Musuh: Angela memperkuat diver dengan perlindungan.');
 if(pair('Johnson','Kadita'))synergy.push('Musuh: Johnson + Kadita, engage dan burst area.');
 if(en.some(n=>inGroup(n,'grouping'))&&en.some(n=>['Pharsa','Yve','Odette','Vexana','Xavier'].includes(n)))synergy.push('Musuh: grouping + follow-up damage area.');
 const enemyCombo=synergy.length;
 for(const n of al){const x=heroIntel(n);synergy.push(`${n} + Gord: ${x.ally}`);}
 const enemySetup=en.filter(n=>heroIntel(n).setup>=3);
 const enemyFollow=en.filter(n=>heroIntel(n).burst>=2||heroIntel(n).poke>=2);
 if(enemySetup.some(n=>enemyFollow.some(m=>m!==n)))synergy.push('Musuh: setup CC + follow-up burst/poke; hindari posisi berkelompok.');
 for(const n of en){const x=heroIntel(n);if(x.access>=3&&x.burst>=2&&al.some(m=>heroIntel(m).peel>=3))synergy.push(`${n}: diver berbahaya; peel teman membantu jika berada dekat dan skill siap.`);}
 const antiDash=al.filter(n=>['Khufra','Minsitthar'].includes(n)).length;
 const dashThreat=enemies.filter(x=>x.dashHeavy&&x.access>=2).length;
 if(antiDash&&dashThreat)synergy.push('Anti-dash teman membantu melawan diver; bergantung posisi dan cooldown.');
 if(en.includes('Diggie')&&allies.some(x=>x.setup>=3))synergy.push('Diggie musuh dapat menggagalkan setup CC yang bisa dibersihkan.');
 const protection=allies.reduce((v,x)=>v+x.peel*.65,0)+allyFront*.22+allyShield*.25+allyHeal*.2;
 const diveNeed=Math.max(0,enemies.reduce((v,x)=>v+x.access*(.8+x.burst*.18)+x.interrupt*.18,0)+enemyCombo*1.1-protection*.35-Math.min(2,antiDash*dashThreat*.45));
 const slowNeed=Math.max(0,enemies.reduce((v,x)=>v+(x.access*.55+x.escape*.45)*x.slowFit,0)-allyCC*.2);
 const pokeNeed=enemies.reduce((v,x)=>v+x.poke*.65,0);
 const ccNeed=enemies.reduce((v,x)=>v+x.interrupt,0);
 const hardHeal=healNeed+shieldNeed*.4>=3.4;
 const hardDive=diveNeed>=5.2;
 const hardTank=tankNeed>=4.1;
 const hardSlow=slowNeed>=4;
 const boots='shoes';
 const S={talisman:39,glow:8+Math.min(75,healNeed*9+shieldNeed*2),lantern:25+Math.min(55,tankNeed*8),ice:12+Math.min(45,slowNeed*7),winter:5+Math.min(70,diveNeed*8),wings:18+Math.min(35,diveNeed*2+pokeNeed*3),divine:18+Math.min(48,penetrationNeed*8),crystal:49,genius:34+(tankNeed<3?10:0),lightning:43,clock:21+Math.min(25,diveNeed*2),fleeting:15+Math.min(12,allyCC),sky:-25};
 const candidates=Object.keys(S).filter(id=>!(excludeWinter&&id==='winter'));
 let best=null;
 function evaluate(ids){
  const cdItem=10+ids.reduce((v,id)=>v+I[id].cd,0);
  const cap=ids.includes('talisman')?45:40;
  const rawCD=cdItem+10, cd=Math.min(cap,rawCD);
  if(cd<40||!ids.some(id=>['crystal','genius','lightning'].includes(id)))return;
  let score=ids.reduce((v,id)=>v+S[id],0)+(cd-40)*2-Math.max(0,rawCD-cap)*1.2;
  if(hardHeal&&!ids.includes('glow'))score-=55;
  if(hardTank&&!ids.includes('lantern'))score-=30;
  if(hardDive&&!ids.some(id=>['winter','wings','clock'].includes(id)))score-=35;
  if(!ids.includes('talisman'))score-=8; // Mana risk, not a mandatory item.
  if(ids.includes('fleeting')&&!ids.includes('lightning'))score-=8;
  if(!best||score>best.score)best={ids,score,cd,rawCD,cdItem,cap};
 }
 function combinations(start,ids){if(ids.length===5){evaluate(ids);return;}for(let i=start;i<=candidates.length-(5-ids.length);i++)combinations(i+1,[...ids,candidates[i]]);}
 combinations(0,[]);
 const early=id=>S[id]+(id==='talisman'?18:id==='glow'&&hardHeal?30:id==='winter'&&hardDive?25:0)-(id==='crystal'?50:id==='divine'?20:0);
 const remaining=[...best.ids].sort((a,b)=>early(b)-early(a));
 // Ensure early CDR progression.
 if(I[remaining[0]].cd===0&&I[remaining[1]].cd===0){const k=remaining.findIndex(id=>I[id].cd>0);if(k>1)remaining.splice(1,0,...remaining.splice(k,1));}

 const order=[boots,...remaining];
 const diagnostics={healNeed,tankNeed,diveNeed,slowNeed,protection,enemyCC,enemyMagic,enemyPoke,hardHeal,hardDive,hardTank,hardSlow,synergy,ccNeed,pokeNeed};
 const hardLock=en.some(n=>H.get(n).cc.includes('suppress')||H.get(n).mechanics.control.includes('area_lock'));
 const spell=ccNeed>=8&&!hardLock&&diveNeed<5?'Purify':'Flicker';
 return {...best,order,boots,second:order[1],spell,signals:diagnostics,scores:S};

}
function noteFor(id,a){
 const s=a.signals;
 const map={
 shoes:'Butuh cooldown awal untuk terus zoning.',arcane:'Draft relatif ringan: fokus tekanan damage awal.',tough:'Banyak ancaman magic dan CC; bantu jaga posisi.',
 talisman:'Opsional: regenerasi mana dan CDR; dipilih jika memberi nilai build terbaik.',
 glow:`Prediksi heal, regen dan spell vamp (${strength(s.healNeed)}); shield dianalisis terpisah.`,
 lantern:`Frontline / HP tebal (${strength(s.tankNeed)}).`,
 ice:`Efektivitas slow terhadap musuh (${strength(s.slowNeed)}); dash tidak otomatis terhenti.`,
 winter:`Ancaman dive / burst ke Gord (${strength(s.diveNeed)}).`,
 wings:'Tambahan shield menghadapi poke dan dive.',
 genius:'Multi-hit Gord mengurangi magic defense lawan.',
 lightning:'Tambahan damage area dan CDR.',
 crystal:'Menjaga damage skill / ultimate tetap tinggi.',
 divine:'Prediksi kebutuhan magic penetration dari jumlah dan ketebalan frontline; bukan pembacaan item musuh.',

 clock:'Ketahanan dan regen ekstra menghadapi tekanan.',
 fleeting:'Jika kill/assist sering terjadi, ultimate lebih cepat pulih.',
 sky:'Execute situasional, biasanya bukan prioritas Gord.'
 };
 return map[id]||I[id].why;
}
function strength(v){return v>=6?'tinggi':v>=2.8?'sedang':'rendah'}
function tags(a){const s=a.signals,t=[];
 if(s.healNeed>=2.8)t.push('Antiheal');
 if(s.tankNeed>=3.5)t.push('Anti-tank');
 if(s.diveNeed>=4.3)t.push('Anti-dive');
 if(s.slowNeed>=3.5)t.push('Slow');
 if(!t.length)t.push('Seimbang');
 return t.slice(0,3);
}
let winterSelected=false;
function build(shouldScroll=true){
 const standard=analyze();
 const canWinter=standard.signals.hardDive&&standard.order.includes('winter');
 if(!canWinter)winterSelected=false;
 const a=canWinter&&winterSelected?standard:analyze({excludeWinter:true});
 const images=id=>face(I[id].imgs,I[id].name);
 const explain=a.order.map((id,index)=>`<div class="why"><b>${index+1}. ${esc(I[id].name)}</b><span>${esc(noteFor(id,a))}</span></div>`).join('');
 const enemyProfiles=selected.enemy.map(n=>profileChip(n)).join('');
 const allyProfiles=selected.ally.map(n=>profileChip(n)).join('');
 byId('result').innerHTML=`<div class="row-title"><b>Build Item</b>${canWinter?`<button id="winterToggle" class="linkbtn" type="button">${winterSelected?'Tanpa Winter':'Dengan Winter'}</button>`:''}</div><div class="chips"><span class="pill">${a.cd}% CDR · item ${a.cdItem}%</span>${tags(a).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div class="itemgrid">${a.order.map((id,ix)=>`<div class="item"><span class="num">${ix+1}</span>${images(id)}<b>${esc(I[id].name)}</b><small>${esc(I[id].desc)}</small></div>`).join('')}</div><div class="micro"><b>Emblem:</b> Mage · Inspire / Bargain Hunter / Impure Rage &nbsp; <b>Spell:</b> ${a.spell}</div><details><summary>Kenapa pilih item ini?</summary>${explain}</details><details><summary>Analisis hero (${selected.enemy.length} musuh + ${selected.ally.length} teman)</summary><div class="tiny-head">Musuh</div>${enemyProfiles||'<div class="tip">Belum ada hero.</div>'}<div class="tiny-head">Teman</div>${allyProfiles||'<div class="tip">Belum ada hero.</div>'}<div class="tip">Mekanik skill dicatat terpisah dari bobot perkiraan. Bukan pembacaan item musuh secara langsung; rank tier lama tidak otomatis menjadi win rate patch terbaru.</div></details><details><summary>Synergy & counter draft</summary>${a.signals.synergy.map(x=>`<div class="why">${esc(x)}</div>`).join('')||'Belum ada interaksi khusus.'}</details><div class="tip">${canWinter?(winterSelected?'Mode dengan Winter Crown. ':'Mode tanpa Winter Crown; opsi Winter tersedia karena ancaman dive tinggi. '):'Mode tanpa Winter Crown. '}Magic Boots wajib. Talisman opsional. ${a.order.includes('talisman')?'Mana sustain diprioritaskan.':'Tanpa Talisman: kelola mana dan manfaatkan Impure Rage.'} Prediksi berdasarkan draft Original Server 2.2.23, bukan kejadian atau item langsung dalam match.</div>`;
 if(canWinter)byId('winterToggle').onclick=()=>{winterSelected=!winterSelected;build(false);};
 if(shouldScroll)byId('result').scrollIntoView({behavior:'smooth',block:'start'});
 return a;
}

function profileChip(name){
 const h=H.get(name),x=heroIntel(name),m=h.mechanics;
 const info=[['Damage',m.damage],['Heal',m.healing],['Proteksi',m.protection],['Engage',m.engage],['Special',m.special]].filter(([,v])=>v.length).map(([k,v])=>k+': '+v.join(', ')).join(' · ');
 const patch=h.patchChange?`<p><b>Patch ${esc(h.patchChange.version)}:</b> ${esc(h.patchChange.summary)}</p>`:'';
 return `<details class="heroline"><summary>${esc(h.name)} · ${esc(h.role)} · akses ${x.access}/3</summary><div class="profile"><p><b>Kit:</b> ${esc(h.kit)}</p><p><b>Mobilitas:</b> ${esc(x.movement)} · ${x.mobility}/3</p><p><b>Akses backline:</b> ${x.access}/3 · Escape ${x.escape}/3</p><p><b>Ancaman:</b> ${esc(x.threat)}</p><p><b>Interrupt ultimate:</b> ${x.interrupt}/3 · Burst ${x.burst}/3 · Poke ${x.poke}/3</p><p><b>CC:</b> ${esc(h.cc.join(', ')||'tidak tercatat')}</p><p><b>Slow:</b> bobot relatif ${x.slowFit.toFixed(2)} (bukan persentase slow aktual) · ${x.dashHeavy?'Gerak berbasis dash terindikasi':'Tidak diklasifikasi sebagai dash utama'}</p><p><b>Respons Gord:</b> ${esc(x.response)}</p><p><b>Synergy teman:</b> ${esc(x.ally)} · Setup ${x.setup}/3 · Peel ${x.peel}/3</p><p><b>Timing:</b> ${esc(x.phase)}</p><p><b>Proteksi khusus:</b> ${x.immunity?'Anti-CC/cleanse situasional; ':''}${x.untargetable?'Untargetable/invulnerability situasional; ':''}${esc(info||'Tidak tercatat')}</p>${patch}<p class="tip">${esc(x.review)}. Skor adalah estimasi taktis, bukan data pertandingan.</p></div></details>`;
}

// Data is inline: loading covers data checks + image preflight. We never depend on internet for draft scoring.
(async function boot(){
 const progress=byId('progress'),msg=byId('bootMsg'),skip=byId('skip');
 let entered=false;
 const enter=()=>{if(entered)return;entered=true;document.body.classList.add('ready');};

  skip.onclick=enter;
  const valid=DATA.heroes.length===133&&Object.keys(I).length===16&&Object.keys(deepHeroIntel).length===133&&DATA.heroes.every(h=>h.kit&&h.role&&h.cc&&h.traits&&h.mechanics&&deepHeroIntel[h.name]?.threat&&deepHeroIntel[h.name]?.response&&deepHeroIntel[h.name]?.ally);
  if(!valid){msg.textContent='Data hero tidak lengkap';skip.style.display='block';return;}
  if(navigator.onLine===false){
   enter();
   return;
  }

 const gord='https://static.wikia.nocookie.net/mobile-legends/images/2/27/Hero231-icon.png';
 const tasks=[['Gord',[gord]],...Object.values(I).map(v=>[v.name,v.imgs]),...DATA.heroes.map(h=>[h.name,heroUrls(h.name)])];
 // Hold successfully decoded Image objects in memory while the tab is open.
 // Image URL cache itself may not persist after browser restarts; HTML logic does.
 const memoryImages=new Map();
 let checked=0,ok=0;
 const test=url=>new Promise(resolve=>{
  let finished=false;const img=new Image();
  const timer=setTimeout(()=>done(false),2200);
  function done(success){if(finished)return;finished=true;clearTimeout(timer);img.onload=null;img.onerror=null;resolve(success?img:null)}
  img.onload=()=>done(true);img.onerror=()=>done(false);img.referrerPolicy='no-referrer';img.src=url;
 });
 let next=0;
 async function worker(){
  while(next<tasks.length&&!entered){
   const index=next++, [name,urls]=tasks[index];let found=null;
   for(const url of urls){found=await test(url);if(found){iconsReady.set(name,url);memoryImages.set(name,found);break;}}
   checked++;if(found)ok++;
   progress.style.width=Math.round(checked/tasks.length*100)+'%';
   byId('bootCount').textContent=`${checked}/${tasks.length} gambar dicek · ${ok} tersedia`;
  }
 }
 msg.textContent='Menyiapkan database + semua gambar hero & item…';
 setTimeout(()=>{if(!entered){skip.style.display='block';msg.textContent='Masih memuat gambar. Bisa lanjut, tetapi gambar yang belum siap mungkin kosong.'}},7500);
 await Promise.all(Array.from({length:8},worker));
 if(entered)return;
 if(ok===tasks.length){msg.textContent=`Siap! ${ok} gambar dimuat.`;setTimeout(enter,450)}
 else{msg.textContent=`${ok}/${tasks.length} gambar siap. ${tasks.length-ok} gagal dimuat; login akan tetap offline untuk logic.`;skip.style.display='block';}
})();;
</script><script>
